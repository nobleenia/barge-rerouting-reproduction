experiment:
  name: long-leg-rerouting-test
  random_seed: 20260804

network:
  terminals:
    - A
    - B
    - C

  time_periods:
    - 0
    - 1
    - 2
    - 3
    - 4

  add_holding_arcs: true

  transport_legs:
    - service_id: S_LONG
      origin: A
      destination: B
      departure_time: 0
      arrival_time: 2
      capacity: 10
      direction: forward

    - service_id: S_FUTURE
      origin: B
      destination: C
      departure_time: 2
      arrival_time: 3
      capacity: 10
      direction: forward

demand_generation:
  number_of_demands: 1

  minimum_volume: 1
  maximum_volume: 4

  minimum_fare_per_teu: 10
  maximum_fare_per_teu: 20

  minimum_reservation_time: 0
  maximum_reservation_time: 1

  minimum_availability_lag: 0
  maximum_availability_lag: 1

  minimum_due_slack: 1
  maximum_due_slack: 2

  customer_mix:
    R: 1.0
    P: 0.0
    F: 0.0

solver:
  time_limit_seconds: 60
  relative_mip_gap: 0.0
  log_output: false
